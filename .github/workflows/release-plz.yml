name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-upload the binaries of an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build binaries for, e.g. snapall-v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Keeps one release PR (version bump + changelog) up to date on every push to main;
      # merging it tags the release and creates the GitHub release.
      - uses: MarcoIeni/release-plz-action@v0.5
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Events created with GITHUB_TOKEN do not trigger other workflows, so the binaries
      # are built from this same workflow, gated on "a snapall release tag points at the
      # commit we just pushed".
      - name: Find the release tag, if this push cut one
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git tag --points-at "$GITHUB_SHA" | grep -E '^snapall-v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      # The binary contains MIT/Apache libraries; their notices go into the archive.
      - name: Third-party license notices
        run: |
          cargo fetch --locked
          python3 packaging/third-party-licenses.py "${{ matrix.target }}"
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          include: LICENSE,README.md,THIRD-PARTY-LICENSES.md
          bin: snapall
          target: ${{ matrix.target }}
          # The tag already starts with `snapall-`, so `$tag-$target` gives
          # snapall-v0.1.0-x86_64-unknown-linux-musl (not snapall-snapall-v0.1.0-...).
          archive: $tag-$target
          # The arm64 runner is natively aarch64; without this the action decides a musl
          # target is a cross-compile and tries to install `cross`.
          build-tool: cargo
          tar: unix
          checksum: sha256
          ref: refs/tags/${{ needs.release-plz.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # The distro packages come from the very binary just uploaded, through the same script
      # CI tests, so what ships is what was installed on the test containers.
      - uses: Swatinem/rust-cache@v2
      - name: Build the .deb and .rpm and attach them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-plz.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          cargo install --locked cargo-deb cargo-generate-rpm
          cargo build --release --locked --target "$TARGET" -p snapall
          packaging/build-packages.sh "$TARGET"
          mv dist/SHA256SUMS "dist/SHA256SUMS-$TARGET"
          gh release upload "$TAG" dist/*.deb dist/*.rpm "dist/SHA256SUMS-$TARGET" --clobber

  pkgbuild:
    name: PKGBUILD for the release
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - name: Fill in the version and the checksum of the tag's source tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-plz.outputs.tag }}
        run: |
          version="${TAG#snapall-v}"
          sum="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)"
          sed -i -e "s/^pkgver=.*/pkgver=${version}/" -e "s/^sha256sums=.*/sha256sums=('${sum}')/" packaging/arch/PKGBUILD
          cat packaging/arch/PKGBUILD
          gh release upload "$TAG" packaging/arch/PKGBUILD --clobber
