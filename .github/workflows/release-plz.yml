name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-upload the binaries of an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build binaries for, e.g. snapall-v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      # Keeps one release PR (version bump + changelog) up to date on every push to main;
      # merging it tags the release and creates the GitHub release.
      - uses: MarcoIeni/release-plz-action@v0.5
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Events created with GITHUB_TOKEN do not trigger other workflows, so the binaries
      # are built from this same workflow, gated on "a snapall release tag points at the
      # commit we just pushed".
      - name: Find the release tag, if this push cut one
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git tag --points-at "$GITHUB_SHA" | grep -E '^snapall-v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write # attach the assets to the release
      id-token: write # sign the provenance: keyless, with the workflow's own identity
      attestations: write # store the signed provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends musl-tools
      - run: cargo install --locked cargo-deb cargo-generate-rpm
      # The binary contains MIT/Apache libraries; their notices go into every artifact.
      - run: cargo fetch --locked

      # Everything that ships, built by the one script CI tests: the static binary's tarball (with
      # the completions and the man page), the .deb, the .rpm and their checksums. Nothing else
      # uploads release files, so what is attested and attached is exactly what was tested.
      - name: Build the release files
        env:
          TARGET: ${{ matrix.target }}
        run: |
          packaging/build-binary.sh "$TARGET"
          packaging/build-packages.sh "$TARGET"
          mv dist/SHA256SUMS "dist/SHA256SUMS-$TARGET"

      # A signed statement, made by this workflow, of which source and which build produced each
      # file (SLSA build provenance, Sigstore, keyless: there is no key to store or to leak).
      # Anyone can check it: gh attestation verify FILE --repo grenudi/snapall
      - name: Attest the build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/snapall-v*.tar.gz
            dist/*.deb
            dist/*.rpm

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-plz.outputs.tag }}
          TARGET: ${{ matrix.target }}
        run: gh release upload "$TAG" dist/snapall-v*.tar.gz dist/*.deb dist/*.rpm "dist/SHA256SUMS-$TARGET" --clobber

  pkgbuild:
    name: PKGBUILD for the release
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - name: Fill in the version and the checksum of the tag's source tarball
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-plz.outputs.tag }}
        run: |
          version="${TAG#snapall-v}"
          sum="$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)"
          sed -i -e "s/^pkgver=.*/pkgver=${version}/" -e "s/^sha256sums=.*/sha256sums=('${sum}')/" packaging/arch/PKGBUILD
          cat packaging/arch/PKGBUILD
          gh release upload "$TAG" packaging/arch/PKGBUILD --clobber
