name: Release

on:
  push:
    branches: [main]
  # Rebuild and re-upload the binaries of an existing release tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build binaries for, e.g. snapall-v0.1.0
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # Keeps one release PR (version bump + changelog) up to date on every push to main;
      # merging it tags the release and creates the GitHub release.
      - uses: MarcoIeni/release-plz-action@v0.5
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Events created with GITHUB_TOKEN do not trigger other workflows, so the binaries
      # are built from this same workflow, gated on "a snapall release tag points at the
      # commit we just pushed".
      - name: Find the release tag, if this push cut one
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          git fetch --tags --force
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git tag --points-at "$GITHUB_SHA" | grep -E '^snapall-v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  binaries:
    name: binary (${{ matrix.target }})
    needs: release-plz
    if: needs.release-plz.outputs.tag != ''
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-plz.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: snapall
          target: ${{ matrix.target }}
          # The tag already starts with `snapall-`, so `$tag-$target` gives
          # snapall-v0.1.0-x86_64-unknown-linux-musl (not snapall-snapall-v0.1.0-...).
          archive: $tag-$target
          # The arm64 runner is natively aarch64; without this the action decides a musl
          # target is a cross-compile and tries to install `cross`.
          build-tool: cargo
          tar: unix
          checksum: sha256
          ref: refs/tags/${{ needs.release-plz.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
