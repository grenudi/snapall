name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build, test, lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Documentation links point at files that exist
        run: python3 dev/check-links.py

      # --all-targets: a lint that only fires in a test target is still a lint.
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets --locked -- -D warnings

      # Includes the architecture fitness functions (crates/snapall/tests/architecture.rs).
      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Docs (warnings are errors)
        run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.85.0"
    steps:
      - uses: actions/checkout@v7
      # This job proves the *minimum*, not the pinned toolchain. A rust-toolchain.toml overrides the
      # default toolchain, so the compiler is chosen with RUSTUP_TOOLCHAIN (job env), which wins, and
      # the next step fails if that did not take effect: a silent pass on the wrong compiler would
      # make this job meaningless.
      - run: rustup toolchain install 1.85.0 --profile minimal
      - name: The compiler is really the minimum
        run: rustc -V | grep -q '^rustc 1.85\.'
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-features --locked

  integration:
    name: real snapper on Btrfs
    runs-on: ubuntu-latest
    # The port contract, the real binary and the real TUI, against a real snapper on a
    # loopback Btrfs volume. Unit tests prove the command lines; this proves snapper accepts
    # them and that a user sees and gets what the UI says.
    steps:
      - uses: actions/checkout@v7
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install snapper, btrfs-progs and jq
        run: |
          sudo apt-get update
          sudo apt-get install -y snapper btrfs-progs jq

      - name: Python with a terminal emulator, for the TUI test
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyte

      - name: Build as the normal user
        run: |
          cargo build -p snapall --locked
          cargo test -p snapall-snapper --test real_snapper --no-run --locked \
            --message-format=json | jq -r 'select(.executable != null) | .executable' > "$RUNNER_TEMP/it-bin"
          test -s "$RUNNER_TEMP/it-bin"

      - name: Create the Btrfs fixture
        run: sudo ./dev/btrfs-fixture.sh up

      # First, on the fresh fixture: it asserts exact snapshot counts.
      - name: TUI end to end, in a pseudo-terminal
        run: sudo "$RUNNER_TEMP/venv/bin/python" dev/tui-e2e.py target/debug/snapall

      - name: Port contract against real snapper
        run: sudo SNAPALL_IT=1 "$(cat "$RUNNER_TEMP/it-bin")" --nocapture

      - name: snapall CLI end to end
        run: |
          S="sudo target/debug/snapall --no-dbus"
          $S list | grep -qx snapall_it_a
          $S create --dry-run "ci dry run"
          $S "ci end to end"                       # the shorthand for `create`
          sudo snapper --no-dbus -c snapall_it_a list | grep -q "ci end to end"
          sudo snapper --no-dbus -c snapall_it_b list | grep -q "ci end to end"

          id="$($S snapshots snapall_it_a --json | jq -r '.configs.snapall_it_a[] | select(.description == "ci end to end") | .id')"
          test -n "$id"
          $S delete snapall_it_a "$id"
          if sudo snapper --no-dbus -c snapall_it_a list | grep -q "ci end to end"; then
            echo "the deleted snapshot is still there"; exit 1
          fi

          # A wrong invocation is status 2 and must not touch snapper.
          status=0
          $S delete snapall_it_a 1 --dry-run || status=$?
          test "$status" -eq 2

      - name: Logging and the audit trail, against real snapper
        run: |
          log="$RUNNER_TEMP/audit.jsonl"
          sudo rm -f "$log"
          S="sudo target/debug/snapall --no-dbus"

          $S --log-file "$log" "ci audit"
          id="$($S snapshots snapall_it_a --json | jq -r '.configs.snapall_it_a[] | select(.description == "ci audit") | .id')"
          $S --log-file "$log" delete snapall_it_a "$id"
          failed=0
          $S --log-file "$log" delete snapall_it_a "$id" 2>/dev/null || failed=$?
          test "$failed" -eq 1

          # private: it records privileged actions
          test "$(sudo stat -c %a "$log")" = 600
          # every line is JSON; creations and deletions are there; the second delete is an error
          sudo jq -e -s '
            all(.[]; has("time") and has("level") and has("event") and has("took_ms"))
            and (map(select(.event == "snapshot_created" and .level == "info")) | length) >= 2
            and (map(select(.event == "snapshot_deleted" and .level == "info")) | length) == 1
            and (map(select(.event == "snapshot_deleted" and .level == "error")) | length) == 1
          ' "$log"

          # the stream on stderr, in text
          $S --log text --dry-run 2>&1 | grep -q "INFO  configs_listed count=2"

      - name: Tear down the fixture
        if: always()
        run: sudo ./dev/btrfs-fixture.sh down

  contract:
    name: published contract (argenv)
    runs-on: ubuntu-latest
    # snapall's invocation surface is declared with argenv. Check it with argenv's own CLI,
    # so the contract is judged by the tool that defines the format, not only by our tests.
    steps:
      - uses: actions/checkout@v7
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - run: cargo build -p snapall --locked

      - name: Install the argenv CLI (pinned)
        run: cargo install --locked --git https://github.com/argenv-opencommons/argenv --tag argenv-v0.3.0 argenv-cli

      - name: The committed contract is what the code emits
        run: |
          target/debug/snapall contract > "$RUNNER_TEMP/contract.json"
          jq 'del(.generated, .source)' snapall.argenv.json > "$RUNNER_TEMP/committed.json"
          jq 'del(.generated, .source)' "$RUNNER_TEMP/contract.json" > "$RUNNER_TEMP/produced.json"
          diff -u "$RUNNER_TEMP/committed.json" "$RUNNER_TEMP/produced.json"

      - name: The contract is a valid argenv document
        run: argenv check snapall.argenv.json

      - name: Valid invocations satisfy the contract
        run: |
          for invocation in "create --only root,home --dry-run" "list --json" "delete home 12" "snapshots home" "doctor --install --yes" "--log json list" "--log-file /tmp/x.log tui" "tui"; do
            echo "argenv lint: $invocation"
            # shellcheck disable=SC2086  # the invocation is meant to split into arguments
            argenv lint snapall.argenv.json -- $invocation
          done

      - name: An invalid invocation is rejected
        run: |
          # `! cmd` would not fail the step under `bash -e`; check the status explicitly.
          for invocation in "delete home notanumber" "delete home" "delete" "create --json=yes" "doctor --install=yes" "--log xml list" "list --dry-run" "delete home 3 --dry-run" "--dry-ru" "tui --json"; do
            echo "argenv lint must reject: $invocation"
            status=0
            # shellcheck disable=SC2086  # the invocation is meant to split into arguments
            argenv lint snapall.argenv.json -- $invocation >/dev/null 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then echo "argenv accepted an invalid invocation: $invocation"; exit 1; fi
          done

      - name: A project can be lenient about typos, and only about typos
        run: |
          argenv lint --lenient snapall.argenv.json -- --dry-ru
          status=0
          argenv lint --lenient snapall.argenv.json -- delete home notanumber >/dev/null 2>&1 || status=$?
          if [ "$status" -eq 0 ]; then echo "a bad value must stay an error under --lenient"; exit 1; fi

      - name: Help text the contract implies
        run: argenv usage snapall.argenv.json

  static-binary:
    name: static binary and packages (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Both architectures are built and tested natively: a package that ships for aarch64 is
    # installed on an aarch64 container, not assumed to work because the x86_64 one did.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    steps:
      - uses: actions/checkout@v7
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2

      - name: Install the package builders
        run: cargo install --locked cargo-deb cargo-generate-rpm

      - name: Build the static binary
        run: packaging/build-binary.sh ${{ matrix.target }}

      - name: Build the .deb and .rpm
        run: packaging/build-packages.sh ${{ matrix.target }}

      - name: The published checksums verify (every line names a file that exists)
        run: cd dist && sha256sum --check SHA256SUMS

      - name: The source, for building the Arch package from this commit
        run: git archive --format=tar.gz --prefix=snapall-src/ -o dist/snapall-src.tar.gz HEAD

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  distros:
    name: ${{ matrix.name }} ${{ matrix.arch }}, on a fresh container
    needs: static-binary
    runs-on: ${{ matrix.runner }}
    # The promise is "works on every major distro", so each one is checked for real: a
    # container with no snapper, the actual package manager, the actual package. Arch has no
    # official aarch64 image, so it is x86_64 only.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian,   arch: x86_64,  runner: ubuntu-latest,    image: "debian:stable",              package: deb }
          - { name: Ubuntu,   arch: x86_64,  runner: ubuntu-latest,    image: "ubuntu:24.04",               package: deb }
          - { name: Fedora,   arch: x86_64,  runner: ubuntu-latest,    image: "fedora:latest",              package: rpm-dnf }
          - { name: openSUSE, arch: x86_64,  runner: ubuntu-latest,    image: "opensuse/tumbleweed:latest", package: rpm-zypper }
          - { name: Arch,     arch: x86_64,  runner: ubuntu-latest,    image: "archlinux:latest",           package: arch }
          - { name: Alpine,   arch: x86_64,  runner: ubuntu-latest,    image: "alpine:edge",                package: none }
          - { name: Debian,   arch: aarch64, runner: ubuntu-24.04-arm, image: "debian:stable",              package: deb }
          - { name: Ubuntu,   arch: aarch64, runner: ubuntu-24.04-arm, image: "ubuntu:24.04",               package: deb }
          - { name: Fedora,   arch: aarch64, runner: ubuntu-24.04-arm, image: "fedora:latest",              package: rpm-dnf }
          - { name: openSUSE, arch: aarch64, runner: ubuntu-24.04-arm, image: "opensuse/tumbleweed:latest", package: rpm-zypper }
          - { name: Alpine,   arch: aarch64, runner: ubuntu-24.04-arm, image: "alpine:edge",                package: none }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ matrix.arch }}
          path: dist

      - name: "snapall doctor --install"
        run: docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh /w/packaging/test/doctor-install.sh

      - name: "install the package"
        if: matrix.package != 'none'
        run: docker run --rm -v "$PWD:/w" "${{ matrix.image }}" sh /w/packaging/test/install-package.sh "${{ matrix.package }}"

  reproducible:
    name: the same source builds to the same bytes, wherever it is built
    runs-on: ubuntu-latest
    # Compilers embed build paths and versions. packaging/build-binary.sh removes the paths and
    # rust-toolchain.toml pins the version; this builds the same commit in two different directories
    # and fails if the binaries differ, so the property cannot silently stop holding.
    steps:
      - uses: actions/checkout@v7
      - name: The pinned toolchain (rust-toolchain.toml)
        run: rustup show
      - name: Build the same commit in two different directories
        run: |
          for dir in one/deeply/nested/path two; do
            git worktree add "$RUNNER_TEMP/$dir" HEAD
            (cd "$RUNNER_TEMP/$dir" && packaging/build-binary.sh x86_64-unknown-linux-musl)
          done
          a="$(sha256sum "$RUNNER_TEMP/one/deeply/nested/path/target/x86_64-unknown-linux-musl/release/snapall" | cut -d' ' -f1)"
          b="$(sha256sum "$RUNNER_TEMP/two/target/x86_64-unknown-linux-musl/release/snapall" | cut -d' ' -f1)"
          echo "one: $a"; echo "two: $b"
          test "$a" = "$b"

  completions:
    name: completions and man page, in real shells
    needs: static-binary
    runs-on: ubuntu-latest
    # The completions are generated from the contract, so the question is whether they *work*:
    # each shell is run for real (zsh in a pseudo-terminal, pressing Tab) against snapall's own
    # contract, and the man page goes through groff.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist-x86_64
          path: dist
      - name: Install the shells and groff
        timeout-minutes: 10
        run: |
          apt="sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          $apt update
          $apt install -y --no-install-recommends fish zsh groff-base
          nu_version=0.116.1
          nu="nu-${nu_version}-x86_64-unknown-linux-musl"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --max-time 180 \
            -o "$RUNNER_TEMP/nu.tar.gz" \
            "https://github.com/nushell/nushell/releases/download/${nu_version}/${nu}.tar.gz"
          tar xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP/${nu}/nu" /usr/local/bin/nu
      - name: The completions work in bash, fish, zsh and nushell, and the man page is clean roff
        run: |
          chmod +x dist/snapall-x86_64-unknown-linux-musl
          packaging/test/completions.sh dist/snapall-x86_64-unknown-linux-musl
      - name: The tarball is complete and its binary runs
        run: |
          tar xzf dist/snapall-v*-x86_64-unknown-linux-musl.tar.gz -C "$RUNNER_TEMP"
          root="$(echo "$RUNNER_TEMP"/snapall-v*-x86_64-unknown-linux-musl)"
          "$root/snapall" --version
          for file in LICENSE README.md THIRD-PARTY-LICENSES.md completions/snapall.bash completions/_snapall completions/snapall.fish completions/snapall.nu man/snapall.1.gz; do
            test -f "$root/$file" || { echo "the tarball lacks $file"; exit 1; }
          done

  nix:
    name: nix build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: nix build .#snapall --print-build-logs
      - run: result/bin/snapall --version
      - name: The wrapper puts snapper on the PATH by itself
        run: env -i result/bin/snapall doctor | tee /dev/stderr | grep -q '^ok    snapper' || true

  licenses:
    name: licenses (reuse, cargo-deny)
    runs-on: ubuntu-latest
    # snapall is GPL-3.0-or-later: every file says so, and no dependency may be incompatible.
    steps:
      - uses: actions/checkout@v7
      - uses: fsfe/reuse-action@v6
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
