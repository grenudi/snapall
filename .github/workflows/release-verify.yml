name: Verify release

# CI proves that what we *built* works. This proves that what we *published* works: it
# downloads the assets from the GitHub release, checks them against the checksums published
# beside them, and installs them the way a user would, on a fresh container of each
# distribution and each architecture, including building the PKGBUILD that was attached to the
# release from the tag's real source tarball. Anything uploaded wrongly (a missing file, a stale
# checksum, a package for the wrong architecture, a version that does not match the tag) fails
# here instead of in a user's terminal.
#
# It runs after every Release workflow and does nothing unless that run cut a release tag. It
# can also be run by hand for an existing tag.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify, for example snapall-v0.4.2
        required: true
      attestations:
        description: Require signed build provenance (releases before 0.5.0 have none)
        type: boolean
        default: true

permissions:
  contents: read
  attestations: read

jobs:
  tag:
    name: which release?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Find the release tag, if this run cut one
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags --force
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$(git tag --points-at "$HEAD_SHA" | grep -E '^snapall-v[0-9]' | head -n1 || true)"
          fi
          case "$tag" in
            '' | snapall-v[0-9]*) ;;
            *) echo "not a snapall release tag: $tag" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none}"

  verify:
    name: ${{ matrix.name }} ${{ matrix.arch }}
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "debian:stable",              package: deb,         asset: "*_amd64.deb" }
          - { name: Ubuntu,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "ubuntu:24.04",               package: deb,         asset: "*_amd64.deb" }
          - { name: Fedora,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "fedora:latest",              package: rpm-dnf,     asset: "*.x86_64.rpm" }
          - { name: openSUSE, arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "opensuse/tumbleweed:latest", package: rpm-zypper,  asset: "*.x86_64.rpm" }
          - { name: Arch,     arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "archlinux:latest",           package: arch-release, asset: "PKGBUILD" }
          - { name: Alpine,   arch: x86_64,  runner: ubuntu-latest,    target: x86_64-unknown-linux-musl,  image: "alpine:edge",                package: none,        asset: "" }
          - { name: Debian,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, image: "debian:stable",              package: deb,         asset: "*_arm64.deb" }
          - { name: Ubuntu,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, image: "ubuntu:24.04",               package: deb,         asset: "*_arm64.deb" }
          - { name: Fedora,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, image: "fedora:latest",              package: rpm-dnf,     asset: "*.aarch64.rpm" }
          - { name: openSUSE, arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, image: "opensuse/tumbleweed:latest", package: rpm-zypper,  asset: "*.aarch64.rpm" }
          - { name: Alpine,   arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, image: "alpine:edge",                package: none,        asset: "" }
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
      # Every release since the attestations were introduced must have them; only a manual run
      # for an older tag may switch the requirement off.
      REQUIRE_ATTESTATIONS: ${{ github.event_name == 'workflow_run' || inputs.attestations }}
    steps:
      # The test scripts come from the current commit: they are the harness, not the product.
      - uses: actions/checkout@v7

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern "*-${TARGET}.tar.gz" --pattern "SHA256SUMS-${TARGET}"
          if [ -n "$ASSET" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern "$ASSET"
          fi
          echo "EXPECT_VERSION=${TAG#snapall-v}" >> "$GITHUB_ENV"
          ls -l dist

      - name: The published checksums verify
        run: |
          cd dist
          # --ignore-missing: SHA256SUMS lists the tarball, the .deb and the .rpm, and this job
          # fetched the tarball and one package. Insist that every file it did fetch was checked,
          # so an empty check cannot pass.
          expected=$(find . -maxdepth 1 \( -name '*.tar.gz' -o -name '*.deb' -o -name '*.rpm' \) | wc -l)
          checked=$(sha256sum --check --ignore-missing "SHA256SUMS-${TARGET}" | tee /dev/stderr | grep -c ': OK')
          test "$checked" -eq "$expected" || { echo "checked $checked of $expected downloaded files" >&2; exit 1; }

      - name: The files were built by this repository's release workflow
        if: env.REQUIRE_ATTESTATIONS == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/snapall-v*.tar.gz dist/*.deb dist/*.rpm; do
            [ -f "$file" ] || continue
            echo "gh attestation verify $file"
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-plz.yml"
          done

      - name: The tarball carries the program, the license, the notices, the completions and the man page
        run: |
          scratch="$(mktemp -d)"
          tar xzf "dist/snapall-${TAG#snapall-}-${TARGET}.tar.gz" -C "$scratch"
          root="$scratch/snapall-${TAG#snapall-}-${TARGET}"
          for file in snapall LICENSE README.md THIRD-PARTY-LICENSES.md \
            completions/snapall.bash completions/_snapall completions/snapall.fish completions/snapall.nu \
            man/snapall.1.gz desktop/snapall.desktop desktop/snapall.svg filemanagers/snapall-file-menu filemanagers/snapall.kio-servicemenu.desktop filemanagers/snapall.nemo_action filemanagers/snapall.libfm-action.desktop filemanagers/snapall-nautilus.py install.sh; do
            test -f "$root/$file" || { echo "the tarball lacks $file" >&2; exit 1; }
          done
          head -n 3 "$root/LICENSE" | grep -q 'GNU GENERAL PUBLIC LICENSE'
          # What is shipped is what the binary generates.
          "$root/snapall" completions bash | cmp - "$root/completions/snapall.bash"
          # The doctor test below runs the very binary users download.
          cp "$root/snapall" "dist/snapall-${TARGET}"

      - name: snapall doctor --install, with the published binary
        run: docker run --rm -e EXPECT_VERSION -v "$PWD:/w" "${{ matrix.image }}" sh /w/packaging/test/doctor-install.sh

      - name: Install the published package
        if: matrix.package != 'none'
        run: docker run --rm -e EXPECT_VERSION -v "$PWD:/w" "${{ matrix.image }}" sh /w/packaging/test/install-package.sh "${{ matrix.package }}"

  reproduce:
    name: rebuild ${{ matrix.target }} from the tag and compare
    needs: tag
    if: needs.tag.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest,    target: x86_64-unknown-linux-musl }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    env:
      TAG: ${{ needs.tag.outputs.tag }}
      TARGET: ${{ matrix.target }}
    # The strongest check there is that a release is what its source says: build the tag again, on
    # another machine, with the pinned compiler and the build paths removed, and require the very
    # same binary to come out. (Releases made before the build was reproducible have no
    # packaging/build-binary.sh at their tag and are skipped, with a message.)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
      - name: Can this release be rebuilt reproducibly?
        id: can
        run: |
          if [ -x packaging/build-binary.sh ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "this release predates the reproducible build; nothing to compare"; fi
      - name: The pinned toolchain (rust-toolchain.toml)
        if: steps.can.outputs.yes == 'true'
        run: rustup show
      - name: Rebuild the binary from the tag
        if: steps.can.outputs.yes == 'true'
        run: packaging/build-binary.sh "$TARGET"
      - name: It is byte for byte the published binary
        if: steps.can.outputs.yes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir published
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir published --pattern "*-${TARGET}.tar.gz"
          tar xzf "published/snapall-${TAG#snapall-}-${TARGET}.tar.gz" -C published
          published="$(sha256sum "published/snapall-${TAG#snapall-}-${TARGET}/snapall" | cut -d' ' -f1)"
          rebuilt="$(sha256sum "target/${TARGET}/release/snapall" | cut -d' ' -f1)"
          echo "published: $published"
          echo "rebuilt:   $rebuilt"
          test "$published" = "$rebuilt"
