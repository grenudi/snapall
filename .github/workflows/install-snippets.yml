name: Install snippets

# The README gives each system a block to paste that installs and upgrades snapall. This runs those
# blocks, exactly as written, on that system: install the previous release, upgrade with the
# snippet, remove, install fresh, repeat. The script cuts each snippet out of the README, so what
# is tested is what a user pastes.
#
# It runs after a release has been verified (and only then: Verify release also succeeds on pushes
# that cut no release, which must not trigger this), against the README as it stood at that release's
# tag, so a README written ahead of a release is not blamed on the previous one. By hand it runs
# against main and the latest release.

on:
  workflow_run:
    workflows: [Verify release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  SCRIPT: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/packaging/test/readme-snippets.sh

jobs:
  tag:
    name: which release?
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: The release tag this run cut, if any
        id: tag
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git fetch --tags --force
          tag=""
          if [ "$EVENT" != workflow_dispatch ]; then
            tag="$(git tag --points-at "$HEAD_SHA" | grep -E '^snapall-v[0-9]' | head -n1 || true)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release tag: ${tag:-none (a push that cut no release)}"

  containers:
    name: ${{ matrix.name }} (${{ matrix.arch }})
    needs: tag
    if: github.event_name == 'workflow_dispatch' || needs.tag.outputs.tag != ''
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Debian,   arch: x86_64,  runner: ubuntu-latest,     image: "debian:stable",         family: deb,        setup: "apt-get update -q && apt-get install -y -q --no-install-recommends curl ca-certificates sudo gawk" }
          - { name: Debian,   arch: aarch64, runner: ubuntu-24.04-arm,  image: "debian:stable",         family: deb,        setup: "apt-get update -q && apt-get install -y -q --no-install-recommends curl ca-certificates sudo gawk" }
          - { name: Ubuntu,   arch: x86_64,  runner: ubuntu-latest,     image: "ubuntu:24.04",          family: deb,        setup: "apt-get update -q && apt-get install -y -q --no-install-recommends curl ca-certificates sudo gawk" }
          - { name: Fedora,   arch: x86_64,  runner: ubuntu-latest,     image: "fedora:latest",         family: rpm-dnf,    setup: "dnf install -y sudo gawk" }
          - { name: Fedora,   arch: aarch64, runner: ubuntu-24.04-arm,  image: "fedora:latest",         family: rpm-dnf,    setup: "dnf install -y sudo gawk" }
          - { name: openSUSE, arch: x86_64,  runner: ubuntu-latest,     image: "opensuse/tumbleweed",   family: rpm-zypper, setup: "zypper --non-interactive install sudo gawk curl" }
          - { name: Alpine,   arch: x86_64,  runner: ubuntu-latest,     image: "alpine:latest",         family: tarball,    setup: "apk add --no-cache bash sudo curl gawk" }
          - { name: Alpine,   arch: aarch64, runner: ubuntu-24.04-arm,  image: "alpine:latest",         family: tarball,    setup: "apk add --no-cache bash sudo curl gawk" }
    steps:
      - name: A user's tools
        run: ${{ matrix.setup }}
      # apt, dnf and pacman take their answers from a pipe; zypper reads them from a terminal, and CI has
      # none. So here it is made to take its default answers. The binary itself is replaced, because
      # sudo resolves `zypper` to /usr/bin whatever the PATH says. A person at a terminal gets the
      # prompt, as the README snippet is written for.
      - name: Let zypper answer without a terminal
        if: matrix.family == 'rpm-zypper'
        run: |
          mv /usr/bin/zypper /usr/bin/zypper.real
          printf '#!/bin/sh\nexec /usr/bin/zypper.real --non-interactive "$@"\n' > /usr/bin/zypper
          chmod +x /usr/bin/zypper
      - name: Run the README snippet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNIPPET_REF: ${{ needs.tag.outputs.tag || 'main' }}
        run: curl -fsSL "$SCRIPT" -o /tmp/readme-snippets.sh && bash /tmp/readme-snippets.sh ${{ matrix.family }}

  arch:
    name: Arch (x86_64)
    needs: tag
    if: github.event_name == 'workflow_dispatch' || needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: A user's tools, and a user (makepkg refuses to run as root)
        run: |
          pacman -Syu --noconfirm --needed base-devel sudo curl gawk
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
      - name: Run the README snippet as that user
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNIPPET_REF: ${{ needs.tag.outputs.tag || 'main' }}
        run: |
          curl -fsSL "$SCRIPT" -o /tmp/readme-snippets.sh
          su builder -c "GITHUB_TOKEN='$GITHUB_TOKEN' SNIPPET_REF='$SNIPPET_REF' bash /tmp/readme-snippets.sh arch"

  nix:
    name: Nix
    needs: tag
    if: github.event_name == 'workflow_dispatch' || needs.tag.outputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: cachix/install-nix-action@v31
      - name: Run the README snippet
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SNIPPET_REF: ${{ needs.tag.outputs.tag || 'main' }}
        run: curl -fsSL "$SCRIPT" -o /tmp/readme-snippets.sh && bash /tmp/readme-snippets.sh nix
