version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # ratatui 0.30 needs Rust 1.86+, but snapall's MSRV is 1.85 (docs/adr/0006). Moving the
      # MSRV is a decision, not a bot's job.
      - dependency-name: "ratatui"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # signal-hook stays on 0.3, the version crossterm (via ratatui) already depends on, so the
      # tree holds one copy of it, not two. Revisit when crossterm moves to 0.4.
      - dependency-name: "signal-hook"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
  # The pinned compiler (rust-toolchain.toml). The MSRV is separate and is not a bot's decision.
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
