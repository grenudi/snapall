[workspace]
resolver = "2"
members = [
    "crates/snapall-core",
    "crates/snapall-snapper",
    "crates/snapall-tui",
    "crates/snapall",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/grenudi/snapall"
authors = ["grenudi"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
snapall-core = { path = "crates/snapall-core", version = "0.2.0" }
snapall-snapper = { path = "crates/snapall-snapper", version = "0.2.0" }
snapall-tui = { path = "crates/snapall-tui", version = "0.2.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argenv-resolve = "0.2"
# 0.29, not 0.30: 0.30 needs Rust 1.86+, and snapall keeps MSRV 1.85 for distro packagers.
# Cargo.lock also pins `instability` (ratatui's dependency) to 0.3.10: 0.3.11 and later need
# Rust 1.88 although ratatui 0.29 only asks for ^0.3. Do not `cargo update` it past 0.3.10.
ratatui = "0.29"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
