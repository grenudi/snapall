[workspace]
resolver = "2"
members = ["crates/snapall-core", "crates/snapall-snapper", "crates/snapall"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/grenudi/snapall"
authors = ["grenudi"]

[workspace.dependencies]
snapall-core = { path = "crates/snapall-core", version = "0.1.0" }
snapall-snapper = { path = "crates/snapall-snapper", version = "0.1.0" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
