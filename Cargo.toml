[workspace]
resolver = "2"
members = [
    "crates/snapall-core",
    "crates/snapall-observe",
    "crates/snapall-snapper",
    "crates/snapall-system",
    "crates/snapall-tui",
    "crates/snapall",
]

[workspace.package]
version = "0.26.4"
edition = "2021"
rust-version = "1.85"
repository = "https://github.com/grenudi/snapall"
authors = ["grenudi"]
license = "GPL-3.0-or-later"

[workspace.dependencies]
snapall-core = { path = "crates/snapall-core", version = "0.26.4" }
snapall-observe = { path = "crates/snapall-observe", version = "0.26.4" }
snapall-system = { path = "crates/snapall-system", version = "0.26.4" }
snapall-snapper = { path = "crates/snapall-snapper", version = "0.26.4" }
snapall-tui = { path = "crates/snapall-tui", version = "0.26.4" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argenv-resolve = "0.3.2"
# 0.29, not 0.30: 0.30 needs Rust 1.86+, and snapall keeps MSRV 1.85 for distro packagers.
# Cargo.lock also pins `instability` (ratatui's dependency) to 0.3.10: 0.3.11 and later need
# Rust 1.88 although ratatui 0.29 only asks for ^0.3. Do not `cargo update` it past 0.3.10.
ratatui = "0.29"
# Same major as crossterm (via ratatui) uses, so the tree holds one copy, not two.
signal-hook = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Total functions (canon: "Total functions and explicit errors"): production code returns an
# error instead of panicking. Tests may unwrap; see the `cfg_attr(test, ...)` in each crate.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
