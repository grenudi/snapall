[package]
name = "snapall"
description = "Snapshot every snapper config in one command, from the command line or a terminal UI."
readme = "../../README.md"
keywords = ["snapper", "btrfs", "snapshot", "tui", "cli"]
categories = ["command-line-utilities", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
snapall-core.workspace = true
snapall-observe.workspace = true
snapall-snapper.workspace = true
snapall-tui.workspace = true
argenv-resolve.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
snapall-core = { workspace = true, features = ["testing"] }

[lints]
workspace = true

# ---- distro packages --------------------------------------------------------------------
# Built from the static musl release binary by packaging/build-packages.sh, so one binary
# serves every distribution. Both packages depend on snapper: installing snapall pulls it in.

[package.metadata.deb]
name = "snapall"
maintainer = "grenudi <17498075+grenudi@users.noreply.github.com>"
copyright = "2026, grenudi"
license-file = ["../../LICENSE", "0"]
extended-description = """\
snapall takes a snapshot of every snapper config in one command, and offers \
a terminal UI to browse, create and delete snapshots. It drives snapper; it \
does not replace it."""
section = "utils"
priority = "optional"
depends = "snapper"
assets = [
    ["target/release/snapall", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/snapall/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/snapall/LICENSE", "644"],
    ["../../THIRD-PARTY-LICENSES.md", "usr/share/doc/snapall/THIRD-PARTY-LICENSES.md", "644"],
    # Generated from the contract by packaging/build-packages.sh.
    ["../../packaging/generated/snapall.bash", "usr/share/bash-completion/completions/snapall", "644"],
    ["../../packaging/generated/_snapall", "usr/share/zsh/site-functions/_snapall", "644"],
    ["../../packaging/generated/snapall.fish", "usr/share/fish/vendor_completions.d/snapall.fish", "644"],
    ["../../packaging/generated/snapall.nu", "usr/share/nushell/vendor/autoload/snapall.nu", "644"],
    ["../../packaging/generated/snapall.1.gz", "usr/share/man/man1/snapall.1.gz", "644"],
    # The launcher entry (a terminal running `sudo snapall tui`) and its icon.
    ["../../packaging/desktop/snapall.desktop", "usr/share/applications/snapall.desktop", "644"],
    ["../../packaging/desktop/snapall.svg", "usr/share/icons/hicolor/scalable/apps/snapall.svg", "644"],
    # "Restore from snapshots" in the file managers: the launcher, then one entry per file manager.
    ["../../packaging/filemanagers/snapall-file-menu", "usr/bin/", "755"],
    ["../../packaging/filemanagers/snapall.kio-servicemenu.desktop", "usr/share/kio/servicemenus/snapall.desktop", "644"],
    ["../../packaging/filemanagers/snapall.nemo_action", "usr/share/nemo/actions/snapall.nemo_action", "644"],
    ["../../packaging/filemanagers/snapall.libfm-action.desktop", "usr/share/file-manager/actions/snapall.desktop", "644"],
    ["../../packaging/filemanagers/snapall-nautilus.py", "usr/share/nautilus-python/extensions/snapall.py", "644"],
]

[package.metadata.generate-rpm]
name = "snapall"
summary = "Snapshot every snapper config in one command"
assets = [
    { source = "target/release/snapall", dest = "/usr/bin/snapall", mode = "755" },
    { source = "../../README.md", dest = "/usr/share/doc/snapall/README.md", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/snapall/LICENSE", mode = "644", doc = true },
    { source = "../../THIRD-PARTY-LICENSES.md", dest = "/usr/share/licenses/snapall/THIRD-PARTY-LICENSES.md", mode = "644", doc = true },
    # Generated from the contract by packaging/build-packages.sh.
    { source = "../../packaging/generated/snapall.bash", dest = "/usr/share/bash-completion/completions/snapall", mode = "644" },
    { source = "../../packaging/generated/_snapall", dest = "/usr/share/zsh/site-functions/_snapall", mode = "644" },
    { source = "../../packaging/generated/snapall.fish", dest = "/usr/share/fish/vendor_completions.d/snapall.fish", mode = "644" },
    { source = "../../packaging/generated/snapall.nu", dest = "/usr/share/nushell/vendor/autoload/snapall.nu", mode = "644" },
    { source = "../../packaging/generated/snapall.1.gz", dest = "/usr/share/man/man1/snapall.1.gz", mode = "644", doc = true },
    # The launcher entry (a terminal running `sudo snapall tui`) and its icon.
    { source = "../../packaging/desktop/snapall.desktop", dest = "/usr/share/applications/snapall.desktop", mode = "644" },
    { source = "../../packaging/desktop/snapall.svg", dest = "/usr/share/icons/hicolor/scalable/apps/snapall.svg", mode = "644" },
    # "Restore from snapshots" in the file managers: the launcher, then one entry per file manager.
    { source = "../../packaging/filemanagers/snapall-file-menu", dest = "/usr/bin/snapall-file-menu", mode = "755" },
    { source = "../../packaging/filemanagers/snapall.kio-servicemenu.desktop", dest = "/usr/share/kio/servicemenus/snapall.desktop", mode = "644" },
    { source = "../../packaging/filemanagers/snapall.nemo_action", dest = "/usr/share/nemo/actions/snapall.nemo_action", mode = "644" },
    { source = "../../packaging/filemanagers/snapall.libfm-action.desktop", dest = "/usr/share/file-manager/actions/snapall.desktop", mode = "644" },
    { source = "../../packaging/filemanagers/snapall-nautilus.py", dest = "/usr/share/nautilus-python/extensions/snapall.py", mode = "644" },
]

[package.metadata.generate-rpm.requires]
snapper = "*"
