# What `cargo deny check licenses bans sources` enforces in CI. snapall is
# GPL-3.0-or-later, so every dependency must be GPL-3.0-compatible.

[licenses]
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "CC0-1.0",
    "0BSD",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
version = 2
# The RustSec database. A vulnerability fails the check, as it did under cargo-audit, which this replaces (it was compiled
# from source on every run, 181 seconds of a 193 second CI run). An unmaintained crate fails only when snapall depends on it
# directly: one that arrives through another crate (`paste`, through ratatui) is nothing this project can act on, and was
# only a warning under cargo-audit. A yanked version is a warning.
unmaintained = "workspace"
yanked = "warn"
