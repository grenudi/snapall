[workspace]
changelog_config = "cliff.toml"
dependencies_update = false
# snapall is distributed as binaries and distro packages for now, not through crates.io.
# `publish = false` skips `cargo publish` only; tags, changelogs and releases still happen.
publish = false
# snapall is not on crates.io, so there is no registry to say what was last released. Use the
# git tags (`<package>-v<version>`) as the source of truth, or every release PR would keep
# proposing the version that is already tagged.
git_only = true
git_tag_enable = true
git_release_enable = false

# One GitHub release for the product, not one per internal crate.
[[package]]
name = "snapall"
git_release_enable = true
